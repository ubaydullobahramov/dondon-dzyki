<canvas id="gl"></canvas>
<div id="hud" class="layer hidden">
<div>
<div class="score">
<div class="pl me"><span class="nm" id="nmMe">Ты</span><div class="pips" id="pipsMe"></div></div>
<div class="mid"><span id="sc">0 : 0</span><small id="rnd">РАУНД 1</small></div>
<div class="pl r op"><span class="nm" id="nmOp">Соперник</span><div class="pips" id="pipsOp"></div></div>
</div>
<div style="display:flex;justify-content:center"><div id="status"></div></div>
</div>
<div class="picks" id="picks">
<button class="pick" data-c="r"><span class="e">✊</span><span class="t">Камень</span></button>
<button class="pick" data-c="s"><span class="e">✌️</span><span class="t">Ножницы</span></button>
<button class="pick" data-c="p"><span class="e">✋</span><span class="t">Бумага</span></button>
</div>
</div>
<div id="big"></div>
<div id="lobby" class="layer menu">
<div class="title"><h1>ДОН-ДОН<br>ДЗЫКИ</h1><p>Камень, ножницы, бумага в 3D. До 3 побед.</p></div>
<button class="btn" id="bCreate">Позвать друга</button>
<div class="row"><input id="inCode" maxlength="5" placeholder="Код комнаты" autocomplete="off" autocapitalize="characters"><button class="btn alt" id="bJoin">Войти</button></div>
<button class="btn ghost" id="bBot">Тренировка с ботом</button>
</div>
<div id="wait" class="layer menu hidden">
<div class="card">
<h2 id="wTitle">Комната создана</h2>
<div class="code" id="wCode">·····</div>
<p id="wText">Отправь другу ссылку. Игра начнётся, как только он зайдёт<span class="dots"></span></p>
</div>
<button class="btn" id="bShare">Отправить приглашение</button>
<button class="btn ghost" id="bCancel">Отмена</button>
</div>
<div id="end" class="layer menu hidden">
<div class="card"><h2 id="eTitle">Победа!</h2><p id="eText"></p></div>
<button class="btn" id="bAgain">Реванш</button>
<button class="btn ghost" id="bExit">В меню</button>
</div>
